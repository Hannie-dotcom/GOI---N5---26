<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Minna no Nihongo - Bài 26</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Cánh hoa anh đào rơi */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 28px;
            padding: 32px 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b06d7e; margin-bottom: 20px; }

        /* Flashcard Lật 3D */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 230px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.12);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #f2d5db;
            background: #ffffff;
            padding: 16px;
        }
        .card-front { color: #3a2e30; }
        .card-back {
            background: #fff8f9;
            color: #d85a7f;
            transform: rotateY(180deg);
        }

        .kanji-text { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
        .hint-text { font-size: 12px; color: #b06d7e; margin-top: 10px; opacity: 0.8; }
        
        .hiragana-text { font-size: 22px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .meaning-text { font-size: 18px; font-weight: 700; color: #4a383b; margin-bottom: 10px; }
        
        /* Khung câu ví dụ */
        .example-box {
            background: rgba(216, 90, 127, 0.08);
            border-left: 3px solid #d85a7f;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #5a4046;
            text-align: left;
            width: 100%;
        }
        .example-jp { font-weight: 600; color: #3a2e30; }
        .example-vi { font-size: 12px; color: #7a5c63; }

        /* Danh sách 4 lựa chọn tiếng Việt */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { background: #fff5f7; border-color: #d85a7f; transform: translateY(-1px); }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .opt-btn:disabled { cursor: default; }

        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1; padding: 12px; border: none; background: #f2d5db; color: #8c5665;
            font-weight: 600; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: #d85a7f; color: white; }

        /* Màn hình Chúc mừng khi hoàn thành */
        .congrats-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }
        .congrats-icon { font-size: 60px; margin-bottom: 12px; }
        .congrats-title { font-size: 24px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .congrats-desc { font-size: 15px; color: #5a4046; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn {
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px 32px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(216, 90, 127, 0.3);
        }
        .restart-btn:hover { opacity: 0.95; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Khung học Flashcard chính -->
        <div id="learning-section">
            <div class="header">
                <span id="lesson-title">Minna no Nihongo - Bài 26</span>
                <span id="card-count">1 / 25</span>
            </div>

            <!-- Flashcard lật 3D -->
            <div class="flashcard-wrapper" onclick="toggleFlip()">
                <div class="flashcard" id="card">
                    <div class="card-front">
                        <div class="kanji-text" id="kanji-display">診ます</div>
                        <div class="hint-text">💡 Chạm vào đây để lật xem cách đọc & ví dụ</div>
                    </div>
                    <div class="card-back">
                        <div class="hiragana-text" id="hiragana-display">みます</div>
                        <div class="meaning-text" id="meaning-display">Khám bệnh / Chẩn đoán</div>
                        <div class="example-box">
                            <div class="example-jp" id="example-jp">医者に 診て もらいます。</div>
                            <div class="example-vi" id="example-vi">Tôi nhờ bác sĩ khám bệnh cho.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4 Lựa chọn trắc nghiệm tiếng Việt -->
            <div class="options-grid" id="options-box">
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
            </div>

            <!-- Điều hướng -->
            <div class="controls">
                <button class="nav-btn" onclick="prevCard()">← Thẻ trước</button>
                <button class="nav-btn" onclick="nextCard()">Thẻ tiếp →</button>
            </div>
        </div>

        <!-- Màn hình Chúc mừng sau khi hoàn thành -->
        <div class="congrats-card" id="congrats-section">
            <div class="congrats-icon">🌸🎉</div>
            <div class="congrats-title">おめでとうございます!</div>
            <div class="congrats-desc">
                Chúc mừng bạn đã hoàn thành trọn bộ <strong>25 từ vựng Bài 26</strong>!<br>
                Điểm số trả lời đúng: <strong id="score-text" style="color:#d85a7f;">0/25</strong>
            </div>
            <button class="restart-btn" onclick="restartLesson()">🔄 Học lại Bài 26</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Danh sách từ vựng Bài 26 trích xuất chính xác từ sách Minna no Nihongo II
        const vocabList = [
            { kanji: '診ます', hiragana: 'みます', meaning: 'Khám bệnh / Chẩn đoán', exJp: '医者に 診て もらいます。', exVi: 'Tôi nhờ bác sĩ khám bệnh cho.' },
            { kanji: '探します / 捜します', hiragana: 'さがします', meaning: 'Tìm / Tìm kiếm', exJp: '落とした 財布を 捜します。', exVi: 'Tôi tìm chiếc ví bị rơi.' },
            { kanji: '遅れます［時間に～］', hiragana: 'おくれます', meaning: 'Chậm / Trễ ［giờ］', exJp: '約束の 時間に 遅れました。', exVi: 'Tôi đã trễ hẹn.' },
            { kanji: '間に合います［時間に～］', hiragana: 'まにあいます', meaning: 'Kịp ［giờ］', exJp: '電車の 時間に 間に合いました。', exVi: 'Tôi đã kịp giờ tàu chạy.' },
            { kanji: 'やります', hiragana: 'やります', meaning: 'Làm / Chơi (thân mật hơn します)', exJp: '週末に サッカーを やります。', exVi: 'Cuối tuần tôi chơi bóng đá.' },
            { kanji: '拾います', hiragana: 'ひろいます', meaning: 'Nhặt / Lượm', exJp: '道で 鍵を 拾いました。', exVi: 'Tôi đã nhặt được chìa khóa trên đường.' },
            { kanji: '連絡します', hiragana: 'れんらくします', meaning: 'Liên lạc', exJp: '後で 友達に 連絡します。', exVi: 'Tôi sẽ liên lạc với bạn sau.' },
            { kanji: '気分が いい', hiragana: 'きぶんが いい', meaning: 'Cảm thấy khỏe / Sảng khoái', exJp: '朝 散歩すると、気分が いいです。', exVi: 'Đi dạo buổi sáng cảm thấy rất sảng khoái.' },
            { kanji: '気分が 悪い', hiragana: 'きぶんが わるい', meaning: 'Cảm thấy không khỏe / Mệt', exJp: '少し 気分が 悪いです。', exVi: 'Tôi thấy hơi mệt trong người.' },
            { kanji: '運動会', hiragana: 'うんどうかい', meaning: 'Hội thao / Ngày hội thể thao', exJp: '来週 学校の 運動会が あります。', exVi: 'Tuần sau trường có ngày hội thể thao.' },
            { kanji: '盆踊り', hiragana: 'ぼんおどり', meaning: 'Múa Bon (lễ hội mùa hè)', exJp: 'お祭りで 盆踊りを 踊ります。', exVi: 'Múa Bon tại lễ hội.' },
            { kanji: 'フリーマーケット', hiragana: 'ふりーまーけっと', meaning: 'Chợ trời / Chợ đồ cũ', exJp: 'フリーマーケットで 古着を 買いました。', exVi: 'Tôi đã mua quần áo cũ ở chợ trời.' },
            { kanji: '場所', hiragana: 'ばしょ', meaning: 'Địa điểm / Nơi chốn', exJp: '会議の 場所を 教えて ください。', exVi: 'Xin hãy cho tôi biết địa điểm họp.' },
            { kanji: 'ボランティア', hiragana: 'ぼらんてぃあ', meaning: 'Tình nguyện viên / Việc từ thiện', exJp: '週末 ボランティアに 参加します。', exVi: 'Cuối tuần tôi tham gia làm tình nguyện.' },
            { kanji: '財布', hiragana: 'さいふ', meaning: 'Ví / Bóp tiền', exJp: 'ポケットに 財布を 入れます。', exVi: 'Tôi để ví vào túi quần.' },
            { kanji: 'ごみ', hiragana: 'ごみ', meaning: 'Rác', exJp: 'ここに ごみを 捨てないで ください。', exVi: 'Xin đừng vứt rác ở đây.' },
            { kanji: '国会議事堂', hiragana: 'こっかいぎじどう', meaning: 'Tòa nhà Quốc hội Nhật Bản', exJp: '明日 国会議事堂を 見学します。', exVi: 'Ngày mai tôi sẽ đi tham quan Tòa nhà Quốc hội.' },
            { kanji: '平日', hiragana: 'へいじつ', meaning: 'Ngày thường (thứ 2 đến thứ 6)', exJp: '平日 仕事を します。', exVi: 'Tôi làm việc vào ngày thường.' },
            { kanji: '～弁', hiragana: '～べん', meaning: 'Tiếng / Tiếng địa phương (ví dụ: 大阪弁)', exJp: '関西弁は おもしろいです。', exVi: 'Tiếng vùng Kansai rất thú vị.' },
            { kanji: '今度', hiragana: 'こんど', meaning: 'Lần tới / Dịp tới', exJp: '今度 一緒に ごはんを 食べましょう。', exVi: 'Lần tới chúng ta cùng đi ăn cơm nhé.' },
            { kanji: 'ずいぶん', hiragana: 'ずいぶん', meaning: 'Khá là / Rất (hơn dự đoán)', exJp: '日本語が ずいぶん 上手に なりましたね。', exVi: 'Tiếng Nhật của bạn đã giỏi lên khá nhiều nhỉ.' },
            { kanji: '直接', hiragana: 'ちょくせつ', meaning: 'Trực tiếp', exJp: '先生に 直接 聞きます。', exVi: 'Tôi hỏi trực tiếp thầy/cô giáo.' },
            { kanji: 'いつでも', hiragana: 'いつでも', meaning: 'Bất cứ lúc nào', exJp: 'いつでも 遊びに 来て ください。', exVi: 'Bất cứ lúc nào cũng hãy đến chơi nhé.' },
            { kanji: 'どこでも', hiragana: 'どこでも', meaning: 'Bất cứ đâu', exJp: 'スマホが あれば、どこでも 勉強できます。', exVi: 'Có điện thoại thông minh thì ở đâu cũng học được.' },
            { kanji: 'だれでも', hiragana: 'だれでも', meaning: 'Bất kỳ ai', exJp: 'この 会議には だれでも 参加できます。', exVi: 'Buổi họp này ai cũng có thể tham gia.' }
        ];

        const extraDistractors = [
            "Đọc sách", "Xem phim", "Bưu điện", "Mỗi sáng", "Thứ hai",
            "Tối nay", "Căn phòng", "Bệnh viện", "Trường học", "Cửa hàng"
        ];

        let currentIndex = 0;
        let answeredCurrent = false;
        let correctCount = 0;

        function updateCard() {
            const current = vocabList[currentIndex];
            document.getElementById('card-count').innerText = `${currentIndex + 1} / ${vocabList.length}`;
            document.getElementById('kanji-display').innerText = current.kanji;
            document.getElementById('hiragana-display').innerText = current.hiragana;
            document.getElementById('meaning-display').innerText = current.meaning;
            document.getElementById('example-jp').innerText = current.exJp;
            document.getElementById('example-vi').innerText = current.exVi;
            
            document.getElementById('card').classList.remove('flipped');
            answeredCurrent = false;

            let options = [current.meaning];
            vocabList.forEach(item => {
                if (!options.includes(item.meaning) && options.length < 4) {
                    options.push(item.meaning);
                }
            });

            let distractorIndex = 0;
            while (options.length < 4 && distractorIndex < extraDistractors.length) {
                let text = extraDistractors[distractorIndex];
                if (!options.includes(text)) {
                    options.push(text);
                }
                distractorIndex++;
            }

            options.sort(() => Math.random() - 0.5);

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = options[i];
                btn.className = 'opt-btn';
                btn.disabled = false;
            });
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function checkAnswer(btn) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            document.getElementById('card').classList.add('flipped');

            if(btn.innerText === vocabList[currentIndex].meaning) {
                btn.classList.add('correct');
                correctCount++;
            } else {
                btn.classList.add('wrong');
            }
